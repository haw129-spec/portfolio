<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../global.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/+esm" type="module"></script>
    <script src="main.js" type="module"></script>
</head>
<body>

    <h1 class="projects-title">Meta</h1>

    <div class="container">
        <section>
            <h2>Website Overview</h2>
            <p>
                This page contains information and statistics about my portfolio website.
            </p>
        </section>
    </div>
    <div id="stats"></div>
    <h2>Commits by time of day</h2>
    <div id="chart"></div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd>
        <a href="" id="commit-link" target="_blank"></a>
      </dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <dt>Time</dt>
      <dd id="commit-time"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>
    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>

    <section>
        <h2>Future Visualizations</h2>
        <ul class="legend">
            <li>Commit activity chart</li>
            <li>Project timeline</li>
            <li>Programming language usage</li>
        </ul>
    </section>

</body>
</html>
